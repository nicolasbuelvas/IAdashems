name: Trazabilidad (prompts + logs)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: trazabilidad-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Trazabilidad (prompts + logs)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exigir log + prompt por commit
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: bash .github/scripts/check_trazabilidad.sh
