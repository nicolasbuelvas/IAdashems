name: Lint de commits

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint de commits
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar formato [HH:MM][TEAM-ID][TAG] mensaje
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/lint_commits.sh
