name: Índice de logs

on:
  push:
    paths:
      - 'logs/**'
      - 'tools/indice_logs.py'
      - '.github/workflows/indice-logs.yml'

permissions:
  contents: write

concurrency:
  group: indice-logs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerar:
    name: Índice de logs
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerar INDICE_LOGS.md
        run: python3 tools/indice_logs.py

      - name: Commit y push si cambió
        run: |
          set -euo pipefail
          if git diff --quiet -- logs/INDICE_LOGS.md; then
            echo "El índice ya está al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/INDICE_LOGS.md
          git commit -m "[skip ci] chore(logs): regenerar INDICE_LOGS.md"
          for i in 1 2 3; do
            if git push; then
              echo "Índice publicado."
              exit 0
            fi
            echo "Push rechazado, reintentando ($i/3)..."
            git pull --rebase
          done
          exit 1
